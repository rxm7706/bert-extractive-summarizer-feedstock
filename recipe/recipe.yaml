schema_version: 1

context:
  name: bert-extractive-summarizer
  python_min: 3.8
  version: 0.10.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/dmmiller612/bert-extractive-summarizer/archive/${{ version }}.tar.gz
  sha256: 4bfc5384c9411d3b02501d007087827125dadb42ce0c39333e609bdb91c9f3c4

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.8.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - transformers
    - scikit-learn
    - spacy

tests:
  - python:
      imports:
        - summarizer
        - tests
      pip_check: true

      python_version: ${{ python_min }}.*
about:
  summary: Easy to use extractive text summarization with BERT
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/dmmiller612/bert-extractive-summarizer

extra:
  recipe-maintainers:
    - rxm7706
